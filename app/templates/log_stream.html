<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ process_name }} · live logs</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/cluster.svg') }}" type="image/svg+xml" />
    <style>
        :root {
            --bg: #020617;
            --panel: #0b1220;
            --panel-2: #0f172a;
            --accent: #34D399;
            --accent-soft: rgba(52, 211, 153, 0.18);
            --text: #CBD5E1;
            --muted: #64748B;
            --border: rgba(52, 211, 153, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace;
            font-size: 13px;
            line-height: 1.55;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.7rem 1.1rem;
            background: linear-gradient(135deg, #0b3d2e 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border);
            color: #F8FAFC;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
            font-weight: 600;
        }

        .dot {
            width: 0.6rem;
            height: 0.6rem;
            border-radius: 999px;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            display: inline-block;
            animation: pulse 1.4s infinite;
        }

        .dot.is-offline {
            background: #EF4444;
            box-shadow: 0 0 8px #EF4444;
            animation: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        .name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60vw;
        }

        .badge {
            font-size: 0.65rem;
            font-weight: 500;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            background: var(--accent-soft);
            color: #A7F3D0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .toolbar {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }

        .toolbar button,
        .toolbar a {
            background: transparent;
            color: #F8FAFC;
            border: 1px solid rgba(248, 250, 252, 0.25);
            border-radius: 0.4rem;
            padding: 0.3rem 0.65rem;
            font-size: 0.72rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            transition: background 120ms ease;
        }

        .toolbar button:hover,
        .toolbar a:hover {
            background: rgba(248, 250, 252, 0.1);
        }

        .toolbar button.is-active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: #A7F3D0;
        }

        main {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 1rem 1.2rem 2rem;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .log-line {
            display: block;
        }

        .log-line.sys {
            color: var(--muted);
            font-style: italic;
        }

        footer {
            padding: 0.4rem 1.1rem;
            background: var(--panel-2);
            border-top: 1px solid rgba(52, 211, 153, 0.15);
            font-size: 0.7rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
        }
    </style>
</head>

<body>
    <header>
        <div class="title">
            <span class="dot" id="status-dot"></span>
            <span class="name" id="proc-name">{{ process_name }}</span>
            <span class="badge">live</span>
        </div>
        <div class="toolbar">
            <button type="button" id="btn-pause">Pause</button>
            <button type="button" id="btn-clear">Clear</button>
            <button type="button" id="btn-wrap" class="is-active">Wrap</button>
            <a href="/service/log/{{ process_name }}">Download</a>
        </div>
    </header>

    <main id="log-body" aria-live="polite"></main>

    <footer>
        <span id="line-count">0 lines</span>
        <span id="conn-state">connecting…</span>
    </footer>

    <script>
        (function () {
            const procName = {{ process_name | tojson
        }};
        const body = document.getElementById('log-body');
        const lineCount = document.getElementById('line-count');
        const connState = document.getElementById('conn-state');
        const statusDot = document.getElementById('status-dot');
        const btnPause = document.getElementById('btn-pause');
        const btnClear = document.getElementById('btn-clear');
        const btnWrap = document.getElementById('btn-wrap');

        let paused = false;
        let count = 0;
        let es = null;

        function appendLine(text, klass) {
            const line = document.createElement('span');
            line.className = 'log-line' + (klass ? ' ' + klass : '');
            line.textContent = text;
            body.appendChild(line);
            body.appendChild(document.createTextNode('\n'));
            count += 1;
            lineCount.textContent = count + ' line' + (count === 1 ? '' : 's');
            if (!paused) body.scrollTop = body.scrollHeight;
        }

        function setConn(text, offline) {
            connState.textContent = text;
            statusDot.classList.toggle('is-offline', !!offline);
        }

        function open() {
            if (es) { try { es.close(); } catch (_) { } }
            setConn('connecting…');
            appendLine('$ tail -f /var/log/s6/' + procName + '/current', 'sys');
            es = new EventSource('/service/stream/' + encodeURIComponent(procName));
            es.onopen = () => setConn('streaming');
            es.onmessage = (ev) => appendLine(ev.data);
            es.onerror = () => {
                setConn('disconnected — retrying…', true);
            };
        }

        btnPause.addEventListener('click', () => {
            paused = !paused;
            btnPause.textContent = paused ? 'Resume' : 'Pause';
            btnPause.classList.toggle('is-active', paused);
            if (!paused) body.scrollTop = body.scrollHeight;
        });
        btnClear.addEventListener('click', () => {
            body.innerHTML = '';
            count = 0;
            lineCount.textContent = '0 lines';
        });
        btnWrap.addEventListener('click', () => {
            const on = btnWrap.classList.toggle('is-active');
            body.style.whiteSpace = on ? 'pre-wrap' : 'pre';
        });
        window.addEventListener('beforeunload', () => {
            if (es) { try { es.close(); } catch (_) { } }
        });

        document.title = procName + ' · live logs';
        open();
        }) ();
    </script>
</body>

</html>
