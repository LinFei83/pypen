<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>用户控制台</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/cluster.svg') }}" type="image/svg+xml" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dashboard-bg': '#F8FAFB',
                        'card-border': '#E5E7EB',
                        'status-running': '#10B981',
                        'status-warning': '#F59E0B',
                        'status-offline': '#9CA3AF'
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont',
                            'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cluster.css') }}?v=9" />
    <script defer src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script defer src="{{ url_for('static', filename='js/cluster.js') }}?v=14"></script>
</head>

<body class="bg-dashboard-bg min-h-screen font-sans text-slate-900">

    <div class="dashboard-shell">
    <header class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
            <div class="brand-bar">
                <svg class="brand-logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path
                        d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.6 3.7v7.9L12 19.7 5.4 15.9V8Zm-1 4.7h2v7.3h-2V9Zm4 2h2v1.5a2 2 0 0 1-2 2v-3.5Z" />
                </svg>
                <span>PYPEN</span>
                <span class="brand-version">节点 · 在线</span>
            </div>
            <p class="text-sm text-slate-500" id="connection-status">连接中…</p>
        </div>
        <div class="flex items-center gap-3">
            <span id="project-count-badge"
                class="px-3 py-1 bg-white border border-card-border rounded-full text-xs font-semibold text-slate-600">
                0 个项目
            </span>
        </div>
    </header>

    <main>

        <section class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">

            <div class="bg-white p-6 rounded-2xl border border-card-border shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-start mb-4">
                    <span class="stat-label">项目</span>
                    <svg class="text-slate-400" fill="none" height="20" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" width="20">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <div class="text-3xl font-bold" id="metric-projects">0</div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-card-border shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-start mb-4">
                    <span class="stat-label">运行中</span>
                    <svg class="text-green-500" fill="none" height="20" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" width="20">
                        <circle cx="12" cy="12" r="10"></circle>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
                <div class="text-3xl font-bold" id="metric-running">0</div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-card-border shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-start mb-4">
                    <span class="stat-label">离线</span>
                    <svg class="text-slate-400" fill="none" height="20" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" width="20">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                    </svg>
                </div>
                <div class="text-3xl font-bold" id="metric-offline">0</div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-card-border shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-start mb-4">
                    <span class="stat-label">失败</span>
                    <svg class="text-red-400" fill="none" height="20" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24" width="20">
                        <path
                            d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                        </path>
                        <line x1="12" x2="12" y1="9" y2="13"></line>
                        <line x1="12" x2="12.01" y1="17" y2="17"></line>
                    </svg>
                </div>
                <div class="text-3xl font-bold" id="metric-failed">0</div>
            </div>
        </section>

        <section class="mb-10" id="project-manager">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">项目管理</h2>
                    <p class="text-sm text-slate-500 mt-1">
                        自动扫描 <code class="text-xs bg-slate-100 px-1 rounded">projects/</code>
                        ；在网页启用后立即注册服务，无需重启容器。
                    </p>
                </div>
                <button type="button" id="btn-refresh-projects"
                    class="px-3 py-1.5 bg-white border border-card-border rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-colors">
                    刷新目录
                </button>
            </div>
            <div id="project-manager-list"
                class="bg-white rounded-2xl border border-card-border shadow-sm overflow-hidden">
                <div class="px-4 py-8 text-center text-sm text-slate-400" id="project-manager-empty">
                    正在扫描项目目录…
                </div>
                <table class="w-full text-sm hidden" id="project-manager-table">
                    <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500">
                        <tr>
                            <th class="px-4 py-3 font-semibold">项目</th>
                            <th class="px-4 py-3 font-semibold">状态</th>
                            <th class="px-4 py-3 font-semibold">运行命令</th>
                            <th class="px-4 py-3 font-semibold text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="project-manager-body"></tbody>
                </table>
            </div>
        </section>

        <section class="grid grid-cols-1 lg:grid-cols-3 gap-6" id="worker-grid"
            data-empty-message="尚未配置任何项目。">

        </section>

        <div id="worker-empty"
            class="hidden text-center py-16 text-slate-400 text-sm bg-white rounded-2xl border border-dashed border-card-border">
            当前没有已注册的项目。
        </div>
    </main>
    </div>

    <template id="worker-card-template">
        <div class="bg-white rounded-2xl overflow-hidden shadow-lg relative worker-card">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex items-center gap-2 min-w-0">
                        <div class="w-2.5 h-2.5 rounded-full shrink-0" data-role="status-dot"></div>
                        <h3 class="font-bold text-slate-800 truncate" data-role="name"></h3>
                    </div>
                    <span class="px-2 py-0.5 text-[10px] font-bold rounded shrink-0" data-role="status-badge"></span>
                </div>
                <div class="grid grid-cols-2 gap-y-4 mb-4">
                    <div>
                        <div class="stat-label mb-1">运行时长</div>
                        <div class="text-sm font-semibold" data-role="uptime">—</div>
                    </div>
                    <div>
                        <div class="stat-label mb-1">进程 ID</div>
                        <div class="text-sm font-semibold font-mono" data-role="pid">—</div>
                    </div>
                    <div>
                        <div class="stat-label mb-1">状态</div>
                        <div class="text-sm font-semibold" data-role="raw-status">—</div>
                    </div>
                    <div>
                        <div class="stat-label mb-1">CPU 占用</div>
                        <div class="text-sm font-semibold font-mono" data-role="cpu">—</div>
                    </div>
                </div>
                <div class="cpu-spark mb-4" data-role="cpu-spark">
                    <svg viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true">
                        <path data-role="cpu-area" fill="currentColor" fill-opacity="0.16" d=""></path>
                        <path data-role="cpu-line" fill="none" stroke="currentColor" stroke-width="1.4"
                            stroke-linecap="round" stroke-linejoin="round" d=""></path>
                    </svg>
                    <span class="cpu-spark-empty" data-role="cpu-empty">暂无采样数据</span>
                </div>
            </div>

            <div data-role="controls"></div>
        </div>
    </template>

    <div id="confirm-modal" class="confirm-modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="confirm-panel" role="document">
            <div class="confirm-header">
                <span class="confirm-icon" id="confirm-icon">?</span>
                <h2 id="confirm-title">确认操作</h2>
            </div>
            <p class="confirm-message" id="confirm-message"></p>
            <div class="confirm-actions">
                <button type="button" class="confirm-btn confirm-cancel" id="confirm-cancel">取消</button>
                <button type="button" class="confirm-btn confirm-ok" id="confirm-ok">确认</button>
            </div>
        </div>
    </div>

    <div id="project-form-modal" class="confirm-modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="confirm-panel project-form-panel" role="document">
            <div class="confirm-header">
                <span class="confirm-icon">+</span>
                <h2 id="project-form-title">启用项目</h2>
            </div>
            <form id="project-form" class="project-form">
                <input type="hidden" id="pf-mode" value="create" />
                <label class="pf-field">
                    <span>项目 id</span>
                    <input type="text" id="pf-id" required pattern="[A-Za-z0-9][A-Za-z0-9_-]*" readonly />
                </label>
                <label class="pf-field">
                    <span>运行命令 run_command</span>
                    <input type="text" id="pf-run" required placeholder=".venv/bin/python main.py" />
                </label>
                <label class="pf-field">
                    <span>日志大小 logs_size</span>
                    <input type="text" id="pf-logs" placeholder="10M" value="10M" />
                </label>
                <label class="pf-field">
                    <span>环境变量 env（每行 KEY=VALUE）</span>
                    <textarea id="pf-env" rows="3" placeholder="LOG_LEVEL=info"></textarea>
                </label>
                <div class="pf-grid">
                    <label class="pf-field">
                        <span>定时重启（小时）</span>
                        <input type="text" id="pf-restart" placeholder="0" value="0" />
                    </label>
                    <label class="pf-field">
                        <span>空闲自动启动（分钟）</span>
                        <input type="text" id="pf-idle" placeholder="" value="" />
                    </label>
                </div>
                <div class="pf-checks">
                    <label><input type="checkbox" id="pf-pull" /> 启停时自动 git pull</label>
                    <label><input type="checkbox" id="pf-redeploy" /> 定时任务同步代码后重启</label>
                </div>
                <p class="pf-hint">保存后立即写回 project.toml 并注册 s6，无需重启 Docker。推荐填 <code>.venv/bin/python …</code>（勿用宿主机绝对路径；勿用未加 <code>--no-sync</code> 的 <code>uv run</code>）。</p>
                <div class="confirm-actions">
                    <button type="button" class="confirm-btn confirm-cancel" id="project-form-cancel">取消</button>
                    <button type="submit" class="confirm-btn confirm-ok" id="project-form-ok">保存并启用</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
